name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  bench-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LINKIT_DATA_DIR: ${{ github.workspace }}/.bench-data
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - uses: actions/cache@v4
        with:
          path: .bench-data/models
          key: embed-paraphrase-multilingual-MiniLM-L12-v2
      - run: uv run linkit bench --jobs 1000 --out bench.json
      - run: uv run linkit bench --jobs 1000 --out bench2.json
      - name: Same seed, same numbers
        run: >-
          uv run python -c "import json,sys;
          a,b=(json.load(open(p)) for p in sys.argv[1:]);
          [d.pop('timing') for d in (a,b)];
          sys.exit(a!=b)" bench.json bench2.json
      - run: uv run python scripts/bench_gate.py bench.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
