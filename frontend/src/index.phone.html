<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LinKit All</title>
  <base href="/app/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- linkit-all.github.io/app/ (docs/phone.md): the app's own files, the iroh WASM, and https/wss
       to the iroh relays and address lookup; data travels end-to-end encrypted inside the tunnel -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- the manifest is added by net.phone.ts except on iPhone, whose Home Screen copy must open
       with the pairing link it was added from -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LinKit">
  <meta name="theme-color" content="#e5e2db">
</head>
<body>
  <app-root></app-root>
</body>
</html>
