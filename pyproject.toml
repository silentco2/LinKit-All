[project]
name = "linkit-all"
version = "1.0.0"
description = "Open-source AI job search that runs on your computer: finds jobs, ranks them against your CV, tailors it and fills in applications."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "silentco2", email = "osamakhalifa333@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["job search", "auto apply", "job application", "resume", "cv tailoring",
            "ai agent", "greenhouse", "lever", "ashby", "local llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "aiolimiter>=1.3.0",
    "alembic>=1.20.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.2",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "imap-tools>=1.16.0",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "litellm>=1.105.1",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "msal>=1.31",
    "numpy>=2.4.6",
    "pdf2docx>=0.5.13",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "platformdirs>=4.13.0",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pylatexenc>=2.11",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-jobspy>=1.3.0",
    "rapidfuzz>=3.14.6",
    "scikit-image>=0.26.0",
    "selectolax>=1.0.0",
    "sqlalchemy>=2.1.4",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://silentco2.github.io/LinKit-All/"
Documentation = "https://silentco2.github.io/LinKit-All/"
Source = "https://github.com/silentco2/LinKit-All"
Issues = "https://github.com/silentco2/LinKit-All/issues"
Changelog = "https://github.com/silentco2/LinKit-All/blob/main/CHANGELOG.md"

[project.scripts]
linkit = "linkit_all.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]  # long fixture rows read better unwrapped
"src/linkit_all/apply/answers.py" = ["E501"]  # regex and country tables
"src/linkit_all/apply/form.py" = ["E501"]  # embedded page script

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["pymupdf", "skimage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a real service; opt-in via env vars, see docs/development.md",
    "ui: drives the built Angular UI in a browser (tests/e2e/ui); skips without `ng build` output",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mkdocs-material>=9.7.7",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[[tool.mypy.overrides]]
module = ["jobspy.*", "pdf2docx.*", "apscheduler.*", "pylatexenc.*", "msal.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
# The Angular build is gitignored but must ship inside the wheel (no Node for end users).
artifacts = ["src/linkit_all/static/**"]

[tool.hatch.build.targets.sdist]
# `uv build` makes the wheel from the sdist, so the sdist must carry the web page too.
artifacts = ["src/linkit_all/static/**"]
