[project]
name = "linkit-all"
version = "0.1.0"
description = "Local, open-source AI job search, CV tailoring and auto-apply."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "silentco2", email = "osamakhalifa333@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "jinja2>=3.1.6",
    "litellm>=1.105.1",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "platformdirs>=4.13.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "scikit-image>=0.26.0",
    "sqlalchemy>=2.1.4",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
linkit = "linkit_all.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["pymupdf", "skimage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
