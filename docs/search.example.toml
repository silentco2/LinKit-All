# LinKit All search settings. Import with:  linkit search import search.toml

[search]
queries = ["python developer", "backend engineer"]  # "React/Next.JS Developer" = two searches
locations = ["Cairo, Egypt", "Remote"]   # "" means anywhere
posted_within_days = 14
max_results_per_query = 200              # per site, per query, per location

[sources]
# Company career pages: paste any URL; Greenhouse, Lever and Ashby are detected automatically.
companies = [
  "https://boards.greenhouse.io/stripe",
  "https://jobs.lever.co/palantir",
  "https://jobs.ashbyhq.com/openai",
  "greenhouse:airbnb",
]
jobspy = ["linkedin", "indeed"]          # also: glassdoor, google, zip_recruiter
jobspy_country = "egypt"                 # Indeed country (Glassdoor gets none)
regional = ["wuzzuf", "bayt"]            # also: forasna (use Arabic query words there)

[filters]
title_include = ["engineer", "developer"]
title_exclude = ["intern", "principal", "director"]
locations = ["egypt", "cairo", "remote", "dubai"]
work_modes = ["remote", "hybrid", "onsite"]  # keep the ones you want; unknown mode always passes
seniority = ["junior", "mid", "senior"]  # intern junior mid senior lead manager executive
salary_floor_monthly = 0                 # per month; 0 = off
salary_currency = "EGP"                  # only postings in this currency are compared
company_blacklist = []
one_per_company = true

[matching]
ai_max_jobs = 300                        # best locally-ranked jobs sent to the AI per run
tier_high = 8                            # score 8-10: auto-apply
tier_mid = 5                             # score 5-7: needs your approval; below: hidden
batch_size = 15                          # jobs per AI call

[apply]
live = false                             # false = dry run: fill forms and screenshot, never submit
submit_without_asking = false            # live only: false = each submission waits for your click
max_per_run = 10
daily_cap_per_site = 20                  # live submissions per site per day
headless = false                         # true hides the browser window
min_pause_s = 20                         # random wait between live applications
max_pause_s = 60
parallel_sites = 3                       # sites worked on at once (1-3); the pause is per site
generic_agent = true                     # AI form agent for sites without a dedicated handler

[ai]
# Usually chosen in the setup wizard. Uncomment to set it here.
# provider = "litellm"                   # codex_cli | claude_cli | litellm
# model = "ollama/llama3.1"
# api_base = "http://127.0.0.1:11434"    # local OpenAI-compatible server; keys stay in env

[email]
# Mailbox that receives sign-up verification emails. The app password lives in the vault.
imap_host = "imap.gmail.com"
imap_user = ""                           # empty = your profile email
timeout_s = 300                          # how long to wait for a verification email
poll_s = 10

[schedule]
# Automatic runs while LinKit All is open.
enabled = false
days = [0, 1, 2, 3, 4, 5, 6]             # 0 = Monday ... 6 = Sunday
times = ["09:00"]                        # 24-hour HH:MM, local time
new_run = true                           # false = resume an unfinished run instead
