site_name: LinKit All
site_url: https://silentco2.github.io/LinKit-All/
site_description: >-
  Open-source AI job search that runs on your computer: finds jobs, ranks them against your
  CV, tailors it with small edits and fills in applications. Your data stays local.
repo_url: https://github.com/silentco2/LinKit-All
repo_name: silentco2/LinKit-All
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  launch/
  usability/

theme:
  name: material
  custom_dir: overrides
  font: false # system fonts only: no requests to Google Fonts
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search # built in and fully local

extra:
  generator: false
  # No analytics, no feedback widgets, no social cards.

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Setup wizard: setup.md
  - Using LinKit All:
      - Sources: sources.md
      - LinkedIn hiring posts: linkedin-posts.md
      - Matching: matching.md
      - Job trust check: trust.md
      - Tailoring your CV: tailoring.md
      - Applying: applying.md
      - Action Center: action-center.md
      - Scheduling and reports: scheduling-reports.md
  - Reference:
      - Privacy and security: privacy.md
      - Command line: cli.md
      - Troubleshooting: troubleshooting.md
      - Apply scorecard: scorecard.md
      - Compared with AIHawk and ApplyPilot: compare.md
  - Development: development.md
